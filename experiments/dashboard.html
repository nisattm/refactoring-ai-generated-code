    <td style="width:22%"><div class="hbar"><i style="width:${(Number(m.smells_per_ksloc) || 0) / worst * 100}%"></i></div><span class="mdesc">${fmt(m.smells_per_ksloc, 1)} per 1,000 lines</span></td></tr>`).join("");
  const tests = Object.entries(a.tests || {}).sort().map(([set, c]) => `<div class="fact"><b>${c.passed || 0} / ${c.total}</b><span>${esc(SETNAME[set] || set)} pass at the start</span></div>`).join("");
  const failing = (a.failing || []).map(f => `<li><span class="id">${esc(f.case)}</span> ${esc(f.area || "")}: ${md(f.expected || "")} <span class="muted">(${esc(f.set === "heldout" ? "held-out" : f.set)}, ${esc(f.result)})</span></li>`).join("");
  return head + `<div class="toolbar"><label class="muted">Starting code</label><select id="base">${opts}</select></div>
    <div class="flow" aria-label="How the analyzer works">${steps.map(([i, t, d], n) => `${n ? `<span class="arrow" aria-hidden="true">→</span>` : ""}<div class="fstep"><span class="fi">${i}</span><b>${t}</b><span>${esc(d)}</span></div>`).join("")}</div>
    <p class="flownote">The same five steps run on the starting code and again on every refactoring result, so the two can be compared.</p>
    ${renderGrowth(a)}
    <div class="panel"><h2>The starting code in numbers</h2><p class="lead">Measured ${esc(date(a.measured_at))} · commit ${esc((a.code_sha || "").slice(0, 12))}.</p>
      <div class="facts"><div class="fact"><b>${(sz.sloc || 0).toLocaleString()}</b><span>lines of code (${(sz.files || 0)} files)</span></div>
        <div class="fact"><b>${(sz.cc_units || 0).toLocaleString()}</b><span>functions</span></div><div class="fact"><b>${sz.classes ?? "–"}</b><span>classes</span></div>
        <div class="fact"><b>${sz.clones ?? "–"}</b><span>copy-pasted blocks</span></div></div>
      <h3>The five metrics at the start ${q("metrics", "What they mean")}</h3><div class="facts">${metricTiles}</div></div>
    <div class="panel"><h2>Code smells at the start</h2><p class="lead">${a.smells_total} findings of ${counts.filter(c => c[1]).length} types. Click a type to see where they are.${(a.not_measured || []).length ? ` ${a.not_measured.length} more types of the list cannot be measured reliably and are left out.` : ""}</p>
      <div class="sbars">${smellBars}</div></div>
    ${whereList}
    <div class="panel"><h2>Modules <span class="viewtoggle"><button data-modsort="number" class="${byDensity ? "" : "on"}">By number</button><button data-modsort="density" class="${byDensity ? "on" : ""}">Most problems first</button></span></h2>
      <div class="howto"><b>How to read this table</b>
        <p>The library system is built from ${mods.length} modules (loans, members, fees …). Each row is one module of the starting code.</p>
        <ul><li><b>Lines</b>: how big the module is.</li>
          <li><b>Complexity</b>: average paths per function, <span class="good">lower is better</span>; above about 5 a module's functions branch a lot.</li>
          <li><b>Maintainability</b>: 0–100 score, <span class="good">higher is better</span>.</li>
          <li><b>Duplication %</b>: share of copy-pasted code, <span class="good">lower is better</span>.</li>
          <li><b>Smell density</b>: code smells per 1,000 lines. It is fair between big and small modules, so the longest bars show where the code has the most problems for its size. These modules are where refactoring can help most; the three worst are marked.</li></ul>
        <p class="muted">Example: the API layer has the most smells in total (it is also by far the biggest module), but not the highest density.</p></div>
      <table><tr><th>Module</th><th class="num">Lines</th><th class="num">Complexity</th><th class="num">Maintainability</th><th class="num">Duplication %</th><th class="num">Smells</th><th>Smell density</th></tr>${modRows}</table></div>
    <div class="panel"><h2>Tests at the start</h2><p class="lead">Which tests already pass before any refactoring. A refactoring must keep all of these passing.</p>
      <div class="facts">${tests}</div>${failing ? `<h3>Already failing at the start (bugs of the generated code)</h3><ul>${failing}</ul>` : ""}</div>
    <div class="panel"><h2>Tools and versions</h2><p class="lead">The same versions measure every result.</p>
      <div class="facts">${Object.entries(a.tools || {}).map(([t, v]) => `<div class="fact"><b style="font-size:15px">${esc(t)}</b><span>${esc(v)}</span></div>`).join("")}</div></div>`;
}

// ---- metrics page: one metric at a time, across all runs ---------------------------------------------------------
function metricCard(m) {
  const [, label, , , tool] = METRICS.find(x => x[0] === m), g = METRIC_GUIDE[m];
  return `<div class="mcard" style="--c:${g.color}">
    <div class="mtop"><span class="micon">${g.icon}</span><div><b>${label}</b><div class="mq">${g.question}</div></div>
      <span class="mdir">${HIGHER.has(m) ? "▲ higher is better" : "▼ lower is better"}</span></div>
    <p>${g.plain}</p><p class="analogy">${g.analogy}</p>
    ${g.before ? `<div class="ba"><div><span>Before</span><pre>${highlight(g.before).join("\n")}</pre></div><div><span>After refactoring</span><pre>${highlight(g.after).join("\n")}</pre></div></div>` : ""}
    <dl><dt>Why we measure it</dt><dd>${g.why}</dd><dt>Unit</dt><dd>${g.unit} · ${g.typical}</dd>
      <dt>Measured with</dt><dd>${esc(tool)}</dd><dt>Counts as "same"</dt><dd>if the change is smaller than ${THRESHOLD[m]}</dd></dl></div>`;
}

function renderMetricsPage() {
  const m = METRICS.some(x => x[0] === state.metric) ? state.metric : METRICS[0][0];
  const [, label, digits] = METRICS.find(x => x[0] === m);
  const chips = METRICS.map(([id, l]) => `<button data-metric="${id}" class="${id === m ? "on" : ""}" style="--c:${METRIC_GUIDE[id].color}">${METRIC_GUIDE[id].icon} ${l}</button>`).join("");
  // one row per finished run that has a result: start → result and the change in percent (comparable across codes)
  const rows = state.runs.filter(r => r.status === "finished" && typeof (r.start_metrics || {})[m] === "number").map(r => {
    const start = r.start_metrics[m];
    const kept = typeof (r.best_metrics || {})[m] === "number" ? r.best_metrics[m] : (r.valid ? start : null);
    return { r, start, after: kept, pct: kept === null || !start ? null : 100 * (kept - start) / Math.abs(start), status: (r.metric_status || {})[m] };
  });
  const maxAbs = Math.max(1, ...rows.map(x => Math.abs(x.pct || 0)));
  const bar = x => {
    if (x.pct === null) return `<span class="muted">${x.r.valid === false ? "run did not count" : "no result"}</span>`;
    const good = HIGHER.has(m) ? x.pct > 0 : x.pct < 0, w = Math.abs(x.pct) / maxAbs * 50;
    const tone = x.status === "same" || Math.abs(x.pct) < 1e-9 ? "var(--muted)" : good ? "var(--good)" : "var(--bad)";
    return `<div class="dbar"><span class="zero"></span><i style="width:${w}%;${x.pct < 0 ? `right:50%` : `left:50%`};background:${tone}"></i></div>`;
  };
  const groups = VIEWS.map(id => {
    const list = rows.filter(x => x.r.approach === id);
    if (!list.length) return "";
    return `<tr class="grp"><td colspan="5">${APPROACH[id].name}</td></tr>` + list.map(x => `<tr>
      <td>${esc(runName(x.r))} <span class="id">${esc(x.r.run_id)}</span><span class="desc">${esc(codeOf(x.r).label)}</span></td>
      <td class="num">${fmt(x.start, digits)}</td><td class="num">${x.after === null ? "–" : fmt(x.after, digits)}</td>
      <td class="num">${x.pct === null ? "–" : `<span class="${x.status === "improved" ? "good" : x.status === "worse" ? "bad" : "muted"}">${x.pct > 0 ? "+" : ""}${fmt(x.pct, 1)} %</span>`}</td>
      <td style="width:34%">${bar(x)}</td></tr>`).join("");
  }).join("");
  const c = state.compare || {};
  const means = changeChart(m, label, digits, VIEWS.map(id => ({ label: APPROACH[id].name, short: { single: "Single", iterative: "Iterative", multiagent: "Multi-Agent" }[id], v: ((c[id] || {}).deltas || {})[m] ?? null })));
  return `<div class="pagehead"><h1>Metrics</h1><p>Pick a metric to see what it means and how it changed in every run.</p></div>
    <div class="mchips">${chips}</div>
    <div class="mgrid"><div>${metricCard(m)}</div>
      <div><div class="panel"><h2>Average change per approach</h2><p class="lead">Valid runs only; a run that kept no change counts as 0.</p><div class="charts" style="grid-template-columns:1fr">${means}</div></div></div></div>
    <div class="panel"><h2>${esc(label)} in every run</h2>
      <p class="lead">Value in the starting code, value of the kept result, and the change in percent. The bar shows the change: right of the line is up, left is down; green is better, red is worse.</p>
      ${rows.length ? `<table><tr><th>Run</th><th class="num">Start</th><th class="num">Result</th><th class="num">Change</th><th></th></tr>${groups}</table>` : `<p class="muted">No finished run yet.</p>`}
      <p class="note">Runs on the pilot code and on the full code start from different values, so compare the percent change, not the raw numbers.</p></div>`;
}

// ---- comparison ------------------------------------------------------------------------------------------------
function renderCompare() {
  const c = state.compare || {};
  const row = (label, fn, tip) => `<tr><td${tip ? ` title="${esc(tip)}"` : ""}>${label}${tip ? `<span class="desc">${esc(tip)}</span>` : ""}</td>${VIEWS.map(id => `<td class="num">${fn(c[id] || {})}</td>`).join("")}</tr>`;
  const rate = a => a.valid ? `${a.success} / ${a.valid} (${Math.round(100 * a.success / a.valid)}%)` : "–";
  const scope = { all: "all runs, including trial runs", real: "study runs only", pilot: "trial runs only" }[state.include];
  return `<div class="pagehead"><h1>Refactoring Comparison</h1><p>The three approaches side by side, over the finished runs (${scope}; change it at the bottom left). Only valid runs enter the means. ${q("compare", "How to read the comparison")}</p></div>
  <div class="panel"><table>
    <tr><th></th>${VIEWS.map(id => `<th class="num">${APPROACH[id].name}</th>`).join("")}</tr>
    ${row("Finished runs (valid)", a => a.runs ? `${a.runs} (${a.valid})` : "0", "Runs that ended; in brackets those that count.")}
    ${row("Successful runs", rate, OUTCOME.success[1])}
    ${["failed", "no_improvement", "no_change", "invalid", "discarded_limit"].map(o => row(OUTCOME[o][0], a => (a.outcomes || {})[o] || 0, OUTCOME[o][1])).join("")}
    <tr><th colspan="4">Mean change of the kept result vs the starting code (valid runs)</th></tr>
    ${METRICS.map(([m, label, digits, desc, , short]) => row(label, a => delta(m, (a.deltas || {})[m], digits), short)).join("")}
    <tr><th colspan="4">Effort per valid run</th></tr>
    ${row("Cost (list price)", a => a.usd !== null && a.usd !== undefined ? "$" + fmt(a.usd) : "–", FIELD.cost)}
    ${row("Claude time", a => a.claude_min !== null && a.claude_min !== undefined ? fmt(a.claude_min, 0) + " min" : "–", FIELD.time)}
    ${row("5-hour window used", a => a.window_used !== null && a.window_used !== undefined ? fmt(a.window_used, 0) + " %" : "–", FIELD.window)}
  </table>
  <p class="note">Trial runs (pilot code, scale trials) test the engine and are not comparable with the study runs; choose "Study runs only" for the study results.</p></div>
  <div class="panel"><h2>Charts</h2><p class="lead">Mean change per approach (valid runs); each chart has its own scale.</p>
    <div class="charts">${METRICS.map(([m, label, digits]) => changeChart(m, label, digits, VIEWS.map(id => ({
      label: APPROACH[id].name, short: { single: "Single", iterative: "Iterative", multiagent: "Multi-Agent" }[id],
      v: ((c[id] || {}).deltas || {})[m] ?? null })))).join("")}
    ${(() => { const rates = VIEWS.map(id => { const a = c[id] || {}; return { label: APPROACH[id].name, short: { single: "Single", iterative: "Iterative", multiagent: "Multi-Agent" }[id], v: a.valid ? Math.round(100 * a.success / a.valid) : null }; });
      return rateChart(rates); })()}
    </div></div>`;
}

// ---- guide (opens beside the page; written for readers who are not programmers) ----------------------------------
const METRIC_GUIDE = {
  mean_cc: { icon: "⑂", color: "#2f6fb2", question: "How many different ways can each function run?",
    plain: "Every if, else, loop or and/or gives the code another possible path. A function with many paths is harder to test and easier to get wrong.",
    analogy: "Like a road with many junctions: the more turns you can take, the harder it is to check every route.",
    before: "if member.active:\n    if member.debt > 50:\n        refuse()\n    elif member.is_student:\n        ...", after: "if not can_borrow(member):\n    refuse()",
    why: "The most widely used complexity measure since 1976; it tells us whether functions got simpler.",
    unit: "average paths per function", typical: "Radon rates 1–5 as simple, 11 or more as high" },
  mean_cognitive: { icon: "◎", color: "#7b4fb3", question: "How hard is each function to read for a person?",
    plain: "Like cyclomatic complexity, but it adds extra cost for code nested inside other code, because nesting is what makes code hard to follow.",
    analogy: "A sentence with brackets inside brackets inside brackets is harder to read than three short sentences.",
    before: "for loan in loans:\n    if loan.overdue:\n        for fee in loan.fees:\n            if not fee.paid: ...", after: "for fee in unpaid_overdue_fees(loans): ...",
    why: "Measures readability the way a human feels it; it can improve even when the number of paths stays the same.",
    unit: "average score per function", typical: "we flag a function above 15" },
  mi_weighted: { icon: "♥", color: "#2e7d4f", question: "How easy is each file to maintain overall?",
    plain: "A 0–100 health score that combines size, complexity and how many different words the code uses. Bigger, more tangled files score lower.",
    analogy: "Like a health check-up that combines several readings into one score.",
    before: "", after: "",
    why: "Gives one overall view per file; we weight it by file size so that big files count more.",
    unit: "score 0–100 (higher is better)", typical: "Radon rates a file above 19 as well maintainable, below 10 as poor" },
  duplication_pct: { icon: "⧉", color: "#b36b00", question: "How much of the code is copy-pasted?",

    why: "Removing duplication is one of the main goals of refactoring, and AI-generated code tends to repeat itself.",

  smell_count: { icon: "⚑", color: "#b3261e", question: "How many known bad patterns are in the code?",

    analogy: "Like a building inspector's checklist: each item is not a collapse, but each one is a warning sign.",
    before: "def create(a, b, c, d, e, f, g, h):  # 8 parameters\n    if age > 65: ...                # unexplained number", after: "def create(request):\n    if age > SENIOR_AGE: ...",
    why: "Covers design and logic problems the other four numbers do not see.",
    unit: "number of findings", typical: "fewer is better; each finding is one place in the code" },
};
const SMELLS = { S01: "Function too long (over 45 lines)", S02: "Class with too many methods", S03: "Too many inputs (parameters)",
  S07: "Unused code", S09: "Overly complicated condition", S10: "Code nested too deeply", S11: "Unexplained number in a comparison",
  S18: "Files that depend on each other in a circle", S19: "Errors silently ignored", S20: "Shared default value (a Python trap)",

  const S = [
    ["refactoring", "🔧", "#2f5d8a", "What is refactoring?", `${plain("Refactoring means rewriting code so that it is <b>cleaner and easier to change</b>, while the program <b>does exactly the same thing</b> as before. Nothing new is added and nothing visible changes for the user.")}
      <p class="analogy">Like reorganizing a kitchen: the same dishes come out, but the tools are easier to find and nothing is in the wrong drawer.</p>
      <p>Here the code is a Library Management System (loans, members, fees, reservations …) that an AI wrote. We ask Claude to refactor it and then check two things: <b>is it still correct</b> (the tests) and <b>is it actually better</b> (the five quality metrics).</p>`],
    ["approaches", "🧭", "#7b4fb3", "The three ways of using Claude", `<div class="tiles">${VIEWS.map((id, i) => `<div class="tile"><b>${["①", "②", "③"][i]} ${APPROACH[id].name}</b><p>${esc(APPROACH[id].what)}</p></div>`).join("")}</div>
      ${plain("All three get the same code, the same instruction and the same model. Only the way of working differs: one try, several tries with test results, or a small team of AI roles.")}`],
    ["success", "✅", "#2e7d4f", "When is a refactoring successful?", `<div class="checks">
      <div><span>1</span>Every test that worked before <b>still works</b> (the program does the same thing).</div>
      <div><span>2</span><b>None</b> of the five quality metrics got worse.</div>
      <div><span>3</span><b>At least one</b> of them got better.</div>
      <div><span>4</span>The program's interface (its REST API) is <b>unchanged</b>.</div></div>

      <p><b>Why these five?</b> Together they cover tangled logic, overall health, copy-paste and known bad patterns. They were chosen <b>before</b> the experiments, so no one could pick the metric that happened to improve.</p>

      <div class="tiles"><div class="tile"><b>${SETNAME.feedback}</b><p>${esc(SETTIP.feedback)}</p></div><div class="tile"><b>${SETNAME.heldout}</b><p>${esc(SETTIP.heldout)}</p></div></div>

    ["rounds", "🔁", "#2f5d8a", "Rounds: trying again", `${plain("Iterative and Multi-Agent may try up to three times. Every version is measured; a version that breaks a test or makes the code worse is thrown away, and the best version is kept.")}

      <p class="muted">Open a topic below to learn more.</p></div>`;
  return `<div class="dhead"><div class="row"><h1>Guide</h1><button class="close" data-drawer="0" title="Close the guide">Close ✕</button></div>

}
function goGuide(anchor) {
  state.gopen = anchor;
  document.getElementById("drawer").innerHTML = "";
  setDrawer(true);
  const el = document.getElementById("g-" + anchor);
  if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
}

// ---- events ----------------------------------------------------------------------------------------------------
document.addEventListener("click", e => {
  const g = e.target.closest("[data-guide]");
  if (g) { e.preventDefault(); goGuide(g.dataset.guide); return; }
  const go = e.target.closest("[data-goto]");
  if (go) { e.preventDefault(); goGuide(go.dataset.goto); return; }
  const gt = e.target.closest("[data-gtoggle]");
  if (gt) { const sec = gt.closest(".gcard"); const was = sec.classList.contains("open");
            document.querySelectorAll(".gcard.open").forEach(x => x.classList.remove("open"));
            if (!was) { sec.classList.add("open"); state.gopen = gt.dataset.gtoggle; sec.scrollIntoView({ behavior: "smooth", block: "start" }); } return; }
  const dr = e.target.closest("[data-drawer]");
  if (dr) { setDrawer(dr.dataset.drawer === "1" ? !state.guide : false); return; }
  const ap = e.target.closest("[data-approach]");
  if (ap) { state.approach = ap.dataset.approach; state.key = null; state.detail = null; state.tests = null; state.tm = null; save(); render(); load(true); return; }
  const gvb = e.target.closest("[data-gv]");
  if (gvb) { state.gv = gvb.dataset.gv; save(); render(); return; }
  const ms = e.target.closest("[data-modsort]");
  if (ms) { state.modsort = ms.dataset.modsort; render(); return; }
  const sm = e.target.closest("[data-smell]");
  if (sm) { state.smell = state.smell === sm.dataset.smell ? null : sm.dataset.smell; render(); return; }
  const v = e.target.closest("[data-view]");
  if (v) { e.preventDefault(); state.view = v.dataset.view; state.key = null; state.detail = null; state.tests = null; state.tm = null; save(); render(); load(true); return; }
  const item = e.target.closest("[data-key]");
  if (item) { state.key = item.dataset.key; state.detail = null; state.tests = null; state.tm = null; state.tq = ""; state.open.clear(); save(); render(); load(true); return; }
  const c = e.target.closest("[data-case]");
  if (c) { e.preventDefault(); showCase(c.dataset.case); return; }
  const rt = e.target.closest("[data-rtab]");
  if (rt) { state.rtab = rt.dataset.rtab; save(); render(); return; }
  const mt = e.target.closest("[data-metric]");
  if (mt) { state.metric = mt.dataset.metric; save(); render(); return; }
  const mv = e.target.closest("[data-mv]");
  if (mv) { state.mv = mv.dataset.mv; save(); render(); return; }
  const f = e.target.closest("[data-tf]");
  if (f) { state.tf = f.dataset.tf; state.tall = false; save(); document.querySelectorAll("[data-tf]").forEach(b => b.classList.toggle("on", b.dataset.tf === state.tf)); renderTestsBody(); return; }
  const o = e.target.closest("[data-open]");
  if (o) { const id = o.dataset.open; state.open.has(id) ? state.open.delete(id) : state.open.add(id); renderTestsBody(); return; }
  if (e.target.closest("[data-tall]")) { e.preventDefault(); state.tall = true; renderTestsBody(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "tq") { state.tq = e.target.value; state.tall = false; renderTestsBody(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "ts") { state.ts = e.target.value; save(); renderTestsBody(); }
  if (e.target.id === "base") { state.base = e.target.value; state.smell = null; load(true); }
  if (e.target.id === "tm") { state.tm = e.target.value; state.testsKey = null; state.open.clear(); load(true); }
});
const bar = document.querySelector("aside");
const setBar = () => document.documentElement.style.setProperty("--hh", bar.offsetHeight + "px");
try { new ResizeObserver(setBar).observe(bar); } catch (e) {}
setBar(); addEventListener("resize", setBar);
// theme: auto (follows the computer), light or dark; remembered in this browser
const THEMES = ["auto", "light", "dark"], THEME_LABEL = { auto: "◐ Auto", light: "☀ Light", dark: "☾ Dark" };
function applyTheme() {
  const t = THEMES.includes(state.theme) ? state.theme : "auto";
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  document.getElementById("theme").textContent = THEME_LABEL[t];
}
document.getElementById("theme").addEventListener("click", () => {
  state.theme = THEMES[(THEMES.indexOf(state.theme || "auto") + 1) % THEMES.length]; save(); applyTheme();
});
applyTheme();
const exp = document.getElementById("exp");
exp.checked = !state.noexp;
document.body.classList.toggle("noexp", !!state.noexp);
exp.addEventListener("change", () => { state.noexp = !exp.checked; document.body.classList.toggle("noexp", state.noexp); save(); });
setDrawer(!!state.guide);
const include = document.getElementById("include");
include.value = state.include;
include.addEventListener("change", () => { state.include = include.value; state.key = null; save(); load(true); });
load(true);
setInterval(() => load(false), 3000);
</script>
</body>
</html>
