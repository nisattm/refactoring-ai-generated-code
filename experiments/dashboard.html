<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refactoring Experiments</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1f21; --muted: #6b6f75; --line: #e3e3df; --soft: #f0f0ec;
  --accent: #2f5d8a; --accent-bg: #e8eef5; --good: #2e7d4f; --good-bg: #e6f2ea; --bad: #b3261e; --bad-bg: #fbe9e7;
  --warn: #8a5a00; --warn-bg: #fbf1dc; --live: #1f6fb2; --live-bg: #e4eff8;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #17191b; --panel: #1f2225; --ink: #e6e6e3; --muted: #9aa0a6; --line: #33373b; --soft: #26292d;
          --accent: #8db4dc; --accent-bg: #1f2c3a; --good: #7cc49a; --good-bg: #1f3328; --bad: #f08a80; --bad-bg: #3a2220;
          --warn: #e0b45c; --warn-bg: #3a3020; --live: #8cc2ef; --live-bg: #1d2f3f; } }
:root[data-theme="dark"] { --bg: #17191b; --panel: #1f2225; --ink: #e6e6e3; --muted: #9aa0a6; --line: #33373b; --soft: #26292d;
          --accent: #8db4dc; --accent-bg: #1f2c3a; --good: #7cc49a; --good-bg: #1f3328; --bad: #f08a80; --bad-bg: #3a2220;
          --warn: #e0b45c; --warn-bg: #3a3020; --live: #8cc2ef; --live-bg: #1d2f3f; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
a { color: var(--accent); }
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh;
       background: linear-gradient(to right, var(--panel) 231px, var(--line) 231px, var(--line) 232px, var(--bg) 232px); }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
aside .brand { font-weight: 600; font-size: 15px; padding: 0 8px; }
aside .brand small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
aside .sect { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 14px 8px 4px; }
aside button.nav { display: flex; justify-content: space-between; align-items: center; width: 100%; font: inherit; text-align: left; border: 0; background: none; color: var(--ink); padding: 7px 8px; border-radius: 6px; cursor: pointer; }
aside button.nav:hover { background: var(--soft); }
aside button.nav.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
aside button.nav .n { font-size: 12px; color: var(--muted); font-weight: 400; }
aside button.nav small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
aside .foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
aside .foot select { font: inherit; width: 100%; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); }
.lock.on { color: var(--live); font-weight: 600; }
main { padding: 22px 26px 40px; min-width: 0; }
.pagehead h1 { font-size: 20px; margin: 0; font-weight: 600; }
.pagehead p { margin: 4px 0 16px; color: var(--muted); max-width: 900px; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); background: var(--bg); }
  .panel { overflow-x: auto; }
  aside button.nav { gap: 6px; }
  aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); }
  aside .sect, aside .brand small { display: none; }
  aside button.nav { width: auto; }
  aside button.nav small { display: none; }
  aside .foot { margin: 0; border: 0; padding: 0 8px; flex-direction: row; width: 100%; }
  main { padding: 16px; }
}
.cols { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.list { display: flex; flex-direction: column; gap: 6px; }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; }
.item:hover { border-color: var(--muted); }
.item.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.item .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.item .name { font-weight: 600; }
.item .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.id { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.chip { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; white-space: nowrap; cursor: help; }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 10px; white-space: nowrap; cursor: help; }
.b-success, .s-passed, .s-fixed { background: var(--good-bg); color: var(--good); }
.b-failed, .b-invalid, .s-regression, .s-missing { background: var(--bad-bg); color: var(--bad); }
.b-no_improvement, .b-discarded_limit, .s-failed_unconfirmed, .s-still_failing { background: var(--warn-bg); color: var(--warn); }
.b-no_change, .b-other, .s-skipped { background: var(--soft); color: var(--muted); }
.b-running { background: var(--live-bg); color: var(--live); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; margin-bottom: 16px; }
.panel h2 { font-size: 16px; margin: 0; font-weight: 650; display: flex; align-items: center; gap: 8px; letter-spacing: -.005em; }
.lead { font-size: 12.5px; color: var(--muted); margin: 4px 0 14px; max-width: 760px; line-height: 1.45; }
.panel h3 { font-size: 12px; margin: 14px 0 6px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.q { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line); font-size: 10.5px; color: var(--muted); text-decoration: none; cursor: pointer; font-weight: 600; flex: none; }
.q:hover { border-color: var(--accent); color: var(--accent); }
.title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.title .name { font-size: 18px; font-weight: 600; }
.subtitle { color: var(--muted); margin-top: 2px; }
.story { margin-top: 12px; padding: 10px 12px; border-radius: 6px; background: var(--soft); }
.story.good { background: var(--good-bg); } .story.bad { background: var(--bad-bg); } .story.warn { background: var(--warn-bg); }
.meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px 18px; margin-top: 14px; }
.meta > div > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 1px; }
.meta b { font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.meta em { display: block; font-style: normal; font-size: 11.5px; color: var(--muted); line-height: 1.35; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
td .desc { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.35; max-width: 420px; margin-top: 1px; }
th, td { padding: 8px 8px; }
.good { color: var(--good); } .bad { color: var(--bad); } .muted { color: var(--muted); }
.problem { background: var(--bad-bg); border: 1px solid var(--bad); border-radius: 6px; padding: 12px 14px; margin-bottom: 14px; }
.problem h2 { color: var(--bad); font-size: 15px; margin: 0 0 2px; }
.problem ul { margin: 6px 0 0; padding-left: 18px; }
a.case { font-family: var(--mono); font-size: 12.5px; cursor: pointer; }
.live { border-color: var(--live); }
.live h2 { color: var(--live); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.actions { font-family: var(--mono); font-size: 12.5px; max-height: 260px; overflow: auto; }
.actions div { padding: 2px 0; border-bottom: 1px dashed var(--line); }
.actions .tool { display: inline-block; width: 52px; color: var(--muted); }
pre { font-family: var(--mono); font-size: 12px; background: var(--soft); padding: 10px; border-radius: 4px; white-space: pre-wrap; margin: 6px 0 0; max-height: 320px; overflow: auto; }
.timeline { font-size: 13px; max-height: 280px; overflow: auto; }
.timeline div { display: grid; grid-template-columns: 70px 1fr; gap: 8px; padding: 3px 0; }
.timeline .t { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
details summary { cursor: pointer; color: var(--accent); font-size: 13px; margin-top: 6px; }
.note { font-size: 12px; color: var(--muted); margin-top: 8px; }
/* tests */
.sets { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-bottom: 12px; }
.setbox { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.setbox b { font-size: 18px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; display: flex; margin-top: 6px; }
.bar i { display: block; height: 100%; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.toolbar button { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 3px 10px; border-radius: 14px; cursor: pointer; }
.toolbar button.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
.toolbar input, .toolbar select { font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink); }
.toolbar input { flex: 1; min-width: 180px; }
tr.case-row { cursor: pointer; }
tr.case-row:hover td { background: var(--soft); }
.pill { font-size: 11.5px; padding: 1px 7px; border-radius: 10px; white-space: nowrap; }
.casebox { background: var(--soft); border-radius: 6px; padding: 10px 12px; font-size: 13px; }
.casebox dl { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; margin: 0; }
.casebox dt { color: var(--muted); }
.casebox dd { margin: 0; }
/* guide drawer: opens beside the page so both can be read together */
.app.with-guide { grid-template-columns: 232px minmax(0, 1fr) min(40vw, 580px); }
/* with the guide open the page gets narrower: the run list moves above the run as compact cards */
.app.with-guide .cols { grid-template-columns: minmax(0, 1fr); }
.app.with-guide .list { flex-direction: row; flex-wrap: wrap; max-height: 220px; overflow: auto; }
.app.with-guide .item { flex: 1 1 230px; }
.app.with-guide .item .sub + .sub { display: none; }
@media (max-width: 900px) { .panel { overflow-x: auto; } }
#drawer { display: none; }
.app.with-guide #drawer { display: block; position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--panel); border-left: 1px solid var(--line); }
#drawer .dhead { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px 10px; z-index: 1; }
#drawer .dhead .row { display: flex; align-items: center; gap: 8px; }
#drawer .dhead h1 { font-size: 16px; margin: 0; flex: 1; }
#drawer .dhead button.close { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 4px; cursor: pointer; padding: 1px 9px; }
#drawer .toc { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
#drawer .toc a { font-size: 12px; text-decoration: none; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--ink); }
#drawer .toc a:hover { border-color: var(--accent); color: var(--accent); }
#drawer .dbody { padding: 6px 16px 40px; }
#drawer section { padding: 14px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 110px; }
#drawer section h2 { font-size: 14.5px; margin: 0 0 6px; }
#drawer dl { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; margin: 6px 0 0; font-size: 13px; }
#drawer dt { font-weight: 600; }
#drawer dd { margin: 0; }
#drawer p, #drawer li { font-size: 13px; }
#drawer table td, #drawer table th { font-size: 12.5px; }
@media (max-width: 1200px) { .app.with-guide { grid-template-columns: 232px minmax(0, 1fr); } .app.with-guide #drawer { position: fixed; right: 0; top: 0; width: min(92vw, 560px); z-index: 10; box-shadow: -8px 0 24px rgba(0,0,0,.18); } }
.hint { border-bottom: 1px dotted var(--muted); cursor: help; }
#drawer .toc a { border-color: color-mix(in srgb, var(--c) 35%, var(--line)); }
.gcard { border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; margin: 10px 0; background: var(--panel); scroll-margin-top: 120px; }
.ghead { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 11px 12px; cursor: pointer; font: inherit; color: var(--ink); text-align: left; }
.gicon { width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--c) 14%, transparent); font-size: 16px; flex: none; }
.gtitle { flex: 1; font-weight: 650; font-size: 14.5px; }
.gchev { color: var(--muted); transition: transform .15s; }
.gcard.open .gchev { transform: rotate(180deg); }
.gbody { display: none; padding: 0 14px 14px; font-size: 13.5px; }
.gcard.open .gbody { display: block; }
.plain { background: color-mix(in srgb, var(--c) 9%, var(--panel)); border-radius: 8px; padding: 10px 12px; margin: 2px 0 10px; line-height: 1.5; }
.plain b:first-child { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--c); margin-bottom: 2px; }
.analogy { font-style: italic; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin: 8px 0; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px; } .tile p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
.checks div { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.checks span { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--good-bg); color: var(--good); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
.legend { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; font-size: 12.5px; }
.legend > div { display: grid; grid-template-columns: 130px 1fr; gap: 10px; align-items: start; }
.legend .pill, .legend .badge { justify-self: start; }
.why5 { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
.why5 ul { margin: 6px 0 0; padding-left: 18px; } .why5 li { margin: 4px 0; }
.mcards { display: flex; flex-direction: column; gap: 10px; }
.mcard { border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 8px; padding: 12px; }
.mcard p { margin: 6px 0; }
.mtop { display: flex; gap: 10px; align-items: flex-start; }
.mtop > div { flex: 1; }
.micon { width: 32px; height: 32px; border-radius: 8px; background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); display: inline-flex; align-items: center; justify-content: center; font-size: 17px; flex: none; }
.mq { color: var(--c); font-weight: 600; font-size: 13px; }
.mdir { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.mdir.down, .mdir.up { background: var(--good-bg); color: var(--good); }
.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ba > div > span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.ba pre { margin-top: 2px; font-size: 11.5px; }
.ba > div:first-child pre { border-left: 3px solid var(--bad); } .ba > div:last-child pre { border-left: 3px solid var(--good); }
.mcard dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 8px 0 0; font-size: 12.5px; }
.mcard dt { font-weight: 600; } .mcard dd { margin: 0; }
/* what changed */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
.fact { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.fact b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.fact span { font-size: 12px; color: var(--muted); }
.mlines { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 12px; }
.mline { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 6px; background: var(--soft); }
.mline .arrow { font-weight: 700; width: 18px; text-align: center; }
.mline.good { background: var(--good-bg); } .mline.good .arrow { color: var(--good); }
.mline.bad { background: var(--bad-bg); } .mline.bad .arrow { color: var(--bad); }
.mline small { color: var(--muted); margin-left: auto; white-space: nowrap; }
/* errors in red */
pre.err { background: var(--bad-bg); border-left: 4px solid var(--bad); color: var(--ink); }
pre.err .e { color: var(--bad); font-weight: 600; }
pre.err .gt { background: color-mix(in srgb, var(--bad) 14%, transparent); display: inline-block; width: 100%; }
pre.code { counter-reset: ln; padding-left: 0; }
pre.code span.l { display: block; padding-left: 46px; position: relative; }
pre.code span.l::before { content: attr(data-n); position: absolute; left: 0; width: 36px; text-align: right; color: var(--muted); }
pre.code span.l.hit { background: var(--bad-bg); box-shadow: inset 4px 0 0 var(--bad); color: var(--bad); font-weight: 600; }
body.noexp .lead, body.noexp .desc, body.noexp .meta em, body.noexp .cs, body.noexp .pagehead p { display: none; }
/* charts */
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 14px; }
.chart { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px 6px; }
.chart .ct { font-size: 12.5px; font-weight: 600; }
.chart .cs { font-size: 11px; color: var(--muted); }
.chart svg { display: block; width: 100%; height: auto; margin-top: 4px; }
.chart text { font: 10.5px "Segoe UI", system-ui, sans-serif; fill: var(--muted); }
.chart text.v { fill: var(--ink); font-weight: 600; }
.viewtoggle { display: inline-flex; gap: 4px; margin-left: auto; }
.viewtoggle button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 2px 10px; border-radius: 12px; cursor: pointer; }
.viewtoggle button.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
/* guide */
.guide { display: grid; grid-template-columns: 210px 1fr; gap: 24px; align-items: start; }
.guide .toc { position: sticky; top: 16px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.guide .toc a { text-decoration: none; padding: 3px 8px; border-radius: 4px; color: var(--ink); }
.guide .toc a:hover { background: var(--soft); }
.guide section { scroll-margin-top: 16px; }
.guide h2 { font-size: 16px; }
.guide p, .guide li { max-width: 860px; }
.guide dl { display: grid; grid-template-columns: 200px 1fr; gap: 8px 16px; margin: 8px 0 0; }
.guide dt { font-weight: 600; }
.guide dd { margin: 0; }
@media (max-width: 900px) { .guide { grid-template-columns: 1fr; } .guide .toc { position: static; } .guide dl, .casebox dl { grid-template-columns: 1fr; } }
.flash { animation: flash 1.6s; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* ---- top bar layout (2026-11-23): the menu is a bar fixed at the top; the run list stays in view ---------------- */
:root { --hh: 56px; }
.app, .app.with-guide { display: grid; grid-template-columns: minmax(0, 1fr); background: var(--bg); min-height: 100vh; }
.app.with-guide { grid-template-columns: minmax(0, 1fr) min(40vw, 580px); }
aside { grid-column: 1 / -1; position: sticky; top: 0; z-index: 20; height: auto; overflow: visible; flex-direction: row; flex-wrap: wrap;
        align-items: center; gap: 4px 6px; padding: 8px 18px; border-right: 0; border-bottom: 1px solid var(--line);
        box-shadow: 0 1px 8px rgba(0,0,0,.06); }
aside .brand { padding: 0 14px 0 0; margin-right: 6px; border-right: 1px solid var(--line); white-space: nowrap; }
aside .brand small, aside .sect, aside button.nav small { display: none; }
aside #nav-main { display: flex; gap: 4px; flex-wrap: wrap; }
aside button.nav { width: auto; gap: 8px; padding: 6px 12px; border-radius: 16px; white-space: nowrap; }
aside button.nav .n { background: var(--soft); border-radius: 8px; padding: 0 6px; }
aside button.nav.active .n { background: var(--panel); }
aside .foot { margin: 0 0 0 auto; padding: 0; border: 0; flex-direction: row; align-items: center; gap: 14px; flex-wrap: wrap; }
aside .foot label { display: flex; align-items: center; gap: 6px; }
aside .foot select { width: auto; max-width: 160px; padding: 3px 6px; }
aside .foot { gap: 10px; }
aside .foot #updated { display: none; }
.app.with-guide #drawer { top: var(--hh); height: calc(100vh - var(--hh)); grid-column: 2; grid-row: 2; }
.app main { grid-column: 1; grid-row: 2; }
.app:not(.with-guide) .list { position: sticky; top: calc(var(--hh) + 14px); max-height: calc(100vh - var(--hh) - 28px); overflow: auto; padding-right: 2px; }

@media (max-width: 1200px) { .app.with-guide { grid-template-columns: minmax(0, 1fr); } .app.with-guide #drawer { position: fixed; top: var(--hh); height: calc(100vh - var(--hh)); grid-column: auto; grid-row: auto; } }
@media (max-width: 900px) { aside { position: relative; } aside .foot { margin-left: 0; width: 100%; } .app:not(.with-guide) .list { position: static; max-height: none; }
  .app.with-guide #drawer { top: 0; height: 100vh; } }
/* ---- run tabs, metrics page, quick start ------------------------------------------------------------------- */
.rtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 4px 0 16px; position: sticky; top: var(--hh); background: var(--bg); z-index: 5; padding-top: 6px; }
.rtabs button { font: inherit; font-size: 14px; border: 0; background: none; color: var(--muted); padding: 8px 14px; cursor: pointer; border-bottom: 3px solid transparent; }
.rtabs button.on { color: var(--ink); font-weight: 650; border-bottom-color: var(--accent); }
.tn { font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--bad-bg); }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.mchips button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 18px; cursor: pointer; }
.mchips button.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 13%, var(--panel)); color: var(--c); font-weight: 650; }
.mgrid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-bottom: 16px; }
@media (max-width: 1100px) { .mgrid { grid-template-columns: minmax(0, 1fr); } }
.mgrid .mcard { background: var(--panel); }
.mgrid .chart { max-width: 380px; }
tr.grp td { font-weight: 650; background: var(--soft); }
.dbar { position: relative; height: 14px; }
.dbar .zero { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.dbar i { position: absolute; top: 2px; height: 10px; border-radius: 3px; }
.quick { background: var(--accent-bg); border-radius: 10px; padding: 12px 16px; margin: 12px 0 6px; }
.quick h2 { font-size: 15px; margin: 0 0 4px; }
.quick ol { margin: 6px 0; padding-left: 20px; } .quick li { margin: 5px 0; font-size: 13.5px; }
.quick p { margin: 4px 0 0; font-size: 12.5px; }
.atabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 4px 0 12px; }
.atabs button { font: inherit; text-align: left; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
.atabs button small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.atabs button.on { border-color: var(--accent); background: var(--accent-bg); box-shadow: inset 0 -3px 0 var(--accent); }
.atabs .n { font-size: 12px; color: var(--muted); background: var(--soft); border-radius: 8px; padding: 0 6px; }
.flow { display: flex; align-items: stretch; gap: 6px; margin: 6px 0 4px; flex-wrap: wrap; }
.fstep { flex: 1 1 140px; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6px 4px; }
.fstep .fi { width: 46px; height: 46px; border-radius: 50%; background: var(--accent-bg); display: inline-flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 6px; }
.fstep b { font-size: 13.5px; } .fstep span:last-child { font-size: 12px; color: var(--muted); margin-top: 2px; }
.flow .arrow { align-self: center; font-size: 22px; color: var(--accent); margin-top: -26px; }
.flownote { font-size: 12.5px; color: var(--muted); text-align: center; margin: 0 0 16px; }
.lead2 { font-size: 13.5px; margin: 4px 0 12px; max-width: 900px; }
.mdesc { display: block; font-size: 11.5px; color: var(--muted); }
.grow { display: flex; align-items: center; gap: 18px; margin: 4px 0 14px; }
.grow > div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; min-width: 150px; }
.grow span { display: block; font-size: 12px; color: var(--muted); } .grow b { font-size: 24px; } .grow em { font-style: normal; color: var(--muted); font-size: 12px; margin-left: 6px; }
.arrow.big { font-size: 30px; color: var(--accent); }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 1000px) { .cols2 { grid-template-columns: 1fr; } }
.gchart { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.glegend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); }
.glegend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.grow2 { display: grid; grid-template-columns: 160px 1fr; gap: 12px; align-items: center; }
.grow2 > span { font-size: 13px; }
.gb { display: flex; align-items: center; gap: 8px; height: 16px; margin: 2px 0; }
.gb i { display: block; height: 12px; border-radius: 3px; min-width: 2px; }
.gb b { font-size: 12px; font-weight: 600; white-space: nowrap; } .gb em { font-style: normal; color: var(--muted); font-weight: 400; }
.howto { background: var(--soft); border-radius: 8px; padding: 10px 14px; margin: 8px 0 12px; font-size: 13px; }
.howto ul { margin: 4px 0; padding-left: 18px; } .howto p { margin: 4px 0; } .howto li { margin: 3px 0; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 0 0 16px; }
.steps > div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.steps .si { display: block; font-size: 20px; margin-bottom: 2px; }
.steps .desc { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
.sbars { display: flex; flex-direction: column; gap: 5px; }
.sbar { display: grid; grid-template-columns: minmax(180px, 320px) 1fr 50px; gap: 10px; align-items: center; cursor: pointer; padding: 3px 6px; border-radius: 6px; }
.sbar:hover { background: var(--soft); }
.sbar i { display: block; height: 12px; border-radius: 3px; background: #b3261e; opacity: .75; min-width: 2px; }
.sbar b { text-align: right; font-variant-numeric: tabular-nums; }
.hbar { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; } .hbar i { display: block; height: 100%; background: #b36b00; opacity: .8; }
/* table headers stay in view while their table scrolls past (below the top bar, and below the run tabs) */
main table th { position: sticky; top: var(--hh); background: var(--panel); z-index: 3; box-shadow: 0 1px 0 var(--line); }
main .cols table th { top: calc(var(--hh) + 46px); }
main tr.grp td { position: static; }
@media (max-width: 900px) { main table th { position: static; } }
/* ---- Python code in colour ---------------------------------------------------------------------------------- */
:root { --hk: #8a3fb3; --hs: #2e7d32; --hn: #b35900; --hc: #7a7f85; --hf: #1f5fa8; --hb: #00797a; --hd: #a3367a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hk: #d19af0; --hs: #9ccf7f; --hn: #f0a868; --hc: #8b9198; --hf: #7fb4f0; --hb: #5fd0cf; --hd: #f08fc5; } }
:root[data-theme="dark"] { --hk: #d19af0; --hs: #9ccf7f; --hn: #f0a868; --hc: #8b9198; --hf: #7fb4f0; --hb: #5fd0cf; --hd: #f08fc5; }
.hl-k { color: var(--hk); font-weight: 600; } .hl-s { color: var(--hs); } .hl-n { color: var(--hn); }
.hl-c { color: var(--hc); font-style: italic; } .hl-f { color: var(--hf); font-weight: 600; } .hl-b { color: var(--hb); } .hl-d { color: var(--hd); }
pre.code span.l.hit .hl-k, pre.code span.l.hit .hl-s, pre.code span.l.hit .hl-n, pre.code span.l.hit .hl-f, pre.code span.l.hit .hl-b { color: var(--bad); }
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand">Refactoring Experiments<small>How well do three ways of using Claude refactor AI-generated code?</small></div>
  <div class="sect">Runs by approach</div>
  <span id="nav-main"></span>
  <div class="sect">Results</div>

  <div class="sect">Help</div>
  
  <div class="foot">
    <button class="nav" id="theme" title="Switch between light and dark">◐ Auto</button>
    <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="exp"> Explanations</label>
    <span id="lock" class="lock">–</span>
    <label title="Which runs to show">
      <select id="include">
        <option value="all">All runs</option>
        <option value="real">Study runs only</option>
        <option value="pilot">Trial runs only</option>
      </select>
    </label>
    <span id="updated"></span>
  </div>
</aside>
<main id="main"><p class="empty">Loading…</p></main>
<div id="drawer"></div>
</div>

<script>
// ---- vocabulary: every label on the page and its explanation ---------------------------------------------------
const APPROACH = {
  single: { name: "Single LLM", short: "One prompt, one pass",
            what: "Claude gets one prompt and refactors the code in one call. It cannot run tests and gets no feedback. This is the baseline approach." },
  iterative: { name: "Iterative LLM", short: "Up to 3 rounds with test feedback",
               what: "Claude works in one conversation for up to 3 code-changing rounds. After each round our engine runs the feedback tests and tells Claude which tests broke; a round that makes things worse is undone." },
  multiagent: { name: "Multi-Agent", short: "Analyzer, Refactoring, Reviewer",
                what: "An orchestrator uses three Claude subagents: the Analyzer lists what to improve, the Refactoring agent changes the code, the Reviewer approves or rejects. The orchestrator may run the feedback tests (at most 3 times)." },
};
const VIEWS = ["single", "iterative", "multiagent"];
const KIND = {
  "": { label: "Study run", tip: "A run of the real experiment on the full code. Only these runs count in the study results." },
  pilot: { label: "Pilot run", tip: "Trial run on the smaller pilot code to test the engine before the study. Not part of the study results." },
  scale: { label: "Scale trial", tip: "Trial on the full code to see whether one run fits in the usage limit of a Claude Pro account. Not part of the study results." },
};
const CODE = {
  ce03f54: { label: "Pilot code", tip: "An earlier, smaller version of the AI-generated Library Management System (commit ce03f54, about 6,400 lines of code, modules 1–14)." },
  "v0-ai-baseline": { label: "Full LMS code", tip: "The final AI-generated Library Management System (tag v0-ai-baseline, about 30,000 lines of code). The real experiment starts from this code." },
};
const OUTCOME = {
  success: ["Successful", "No test that passed at the start fails now, no quality metric got worse and at least one improved, and the API is unchanged."],
  no_improvement: ["No improvement", "Nothing broke, but the code did not get better by our rule: no metric improved enough, or one got worse."],
  no_change: ["No change", "Claude did not change any file of the application."],
  failed: ["Failed", "The refactoring broke something: a test that passed at the start now fails, the API changed, or the code no longer loads."],
  invalid: ["Invalid", "The run does not count because of a technical problem (setup, tool permissions, a crash), not because of the code Claude wrote. It is repeated under a new ID."],
  discarded_limit: ["Stopped by usage limit", "The Claude account reached its usage limit during the run. The run does not count and is repeated."],
};
const METRICS = [
  ["mean_cc", "Cyclomatic complexity", 2, "Average number of independent paths through a function (if, for, while, and, or …). Lower is better.", "Radon", "Paths through a function · lower is better"],
  ["mean_cognitive", "Cognitive complexity", 2, "Average effort to read a function; nesting is punished more than in cyclomatic complexity. Lower is better.", "complexipy", "Reading effort · lower is better"],
  ["mi_weighted", "Maintainability index", 1, "0–100 score combining size, complexity and Halstead volume, averaged over files weighted by size. Higher is better.", "Radon", "0–100 score · higher is better"],
  ["duplication_pct", "Duplication %", 2, "Share of the code that is copy-pasted (blocks of at least 5 lines and 50 tokens). Lower is better.", "jscpd", "Copy-pasted code · lower is better"],
  ["smell_count", "Code smells", 0, "Number of design and logic problems from a fixed list of 23 smell types (long method, large class, too many parameters, deep nesting …). Lower is better.", "Ruff, Pylint, own AST checks", "Design and logic problems · lower is better"],
];
const THRESHOLD = { mean_cc: "0.01", mean_cognitive: "0.01", mi_weighted: "0.1", duplication_pct: "0.05 points", smell_count: "1" };
const HIGHER = new Set(["mi_weighted"]);
const TEST_STATUS = {
  regression: ["Broke", "Passed at the start, fails now, and failed again in two repetitions: a real regression caused by the refactoring."],
  failed_unconfirmed: ["Failed once", "Passed at the start and failed in this measurement, but passed when repeated, so it is not counted as a regression (unstable test)."],
  missing: ["Missing", "The test did not report a result (for example the code did not load)."],
  still_failing: ["Failed at start", "Already failed in the starting code (a bug of the generated code), so it is not blamed on the refactoring."],
  fixed: ["Fixed", "Failed at the start and passes now."],
  passed: ["Passed", "Passed at the start and still passes."],
  skipped: ["Skipped", "Skipped by the test itself."],
};
const SETNAME = { feedback: "Feedback tests", heldout: "Held-out tests" };
const SETTIP = { feedback: "Tests whose results Iterative and Multi-Agent may see during refactoring.",
                 heldout: "Hidden tests that no approach ever sees; they check the final result only, so overfitting to the feedback tests shows up here." };
const FIELD = {
  started: "When the engine started the run.",
  code: "The code Claude was asked to refactor.",
  calls: "Claude Code calls made in this run; for Iterative and Multi-Agent also the measured rounds and how many were kept.",
  time: "Time Claude spent working (all calls), without the time our engine spent measuring.",
  cost: "What the tokens would cost at Anthropic's API list prices. We pay a flat Claude Pro subscription, so this is a size measure, not a bill.",
  window: "Share of the account's 5-hour usage limit at the start and after the last call. A run may only start below 10 %.",
  account: "Anonymous label of the Claude Pro account that ran it (exp-1, exp-2 …).",
  model: "Claude model and reasoning effort; the same in every run.",
  subagents: "How often the orchestrator called each subagent.",
  testruns: "How often the orchestrator ran the feedback test command, and the budget.",
  blocked: "Attempts to use something outside the rules (a hidden folder, another command). They were refused; the run stays valid.",
  shell: "Harmless read-only shell commands (like ls) inside the project folder. Counted only.",
  id: "Technical ID of the run: approach letter (s, i, m) and number; a trailing letter (b, c) marks a repeat of an invalid run.",
};

let state = { view: "single", key: null, include: "all", runs: [], compare: {}, detail: null,
              tests: null, testsKey: null, tm: null, tf: "problems", ts: "all", tq: "", tall: false, open: new Set() };
try { const saved = JSON.parse(localStorage.getItem("dash2") || "{}"); Object.assign(state, saved, { open: new Set() }); } catch (e) {}
if (VIEWS.includes(state.view)) { state.approach = state.view; state.view = "runs"; }
if (!["metrics", "analyzer", "runs", "compare"].includes(state.view)) state.view = "runs";
if (!VIEWS.includes(state.approach)) state.approach = "single";
if (!["overview", "tests", "rounds"].includes(state.rtab)) state.rtab = "overview";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const fmt = (v, d = 2) => (v === null || v === undefined || v === "") ? "–" : Number(v).toFixed(d);
const time = iso => iso ? new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
const date = iso => iso ? new Date(iso).toLocaleString([], { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
const mins = s => s ? (s < 60 ? `${Math.round(s)} s` : `${Math.round(s / 60)} min`) : "–";
const q = (anchor, tip) => `<a class="q" data-guide="${anchor}" title="${esc(tip || "Explain")}">?</a>`;
function save() { try { localStorage.setItem("dash2", JSON.stringify({ view: state.view, approach: state.approach, key: state.key, include: state.include, tf: state.tf, ts: state.ts, mv: state.mv, guide: state.guide, noexp: state.noexp, theme: state.theme, rtab: state.rtab, metric: state.metric, gv: state.gv })); } catch (e) {} }

// ---- names that explain themselves -----------------------------------------------------------------------------
function kindOf(run) {
  if (/^scale/.test(run.run_id || "")) return KIND.scale;
  return KIND[run.group] || { label: run.group ? run.group[0].toUpperCase() + run.group.slice(1) + " run" : "Study run", tip: "Trial run; not part of the study results." };
}
function codeOf(run) {
  const c = CODE[run.start_ref] || { label: `Code ${run.start_sha || run.start_ref || "?"}`, tip: "Starting commit of this run." };
  return c;
}
function numberOf(run) {
  const m = /(\d+)([a-z]?)$/.exec(run.run_id || "");
  return m ? { n: Number(m[1]), repeat: m[2] || "" } : { n: null, repeat: "" };
}
function repeatOf(run) {
  const { repeat } = numberOf(run);
  if (!repeat) return null;
  const prev = repeat === "b" ? run.run_id.slice(0, -1) : run.run_id.slice(0, -1) + String.fromCharCode(repeat.charCodeAt(0) - 1);
  return state.runs.find(r => r.run_id === prev && r.approach === run.approach) || { run_id: prev };
}
function runName(run) {
  const { n, repeat } = numberOf(run);
  return `${kindOf(run).label}${n !== null ? " " + n : ""}${repeat ? " (repeat)" : ""}`;
}
function badge(run) {
  if (run.status === "running") return `<span class="badge b-running" title="The run is in progress.">Running</span>`;
  if (run.status === "limit_cut") return `<span class="badge b-discarded_limit" title="${esc(OUTCOME.discarded_limit[1])}">Stopped by usage limit</span>`;
  if (run.status !== "finished") return `<span class="badge b-other">${esc(run.status || "?")}</span>`;
  const o = OUTCOME[run.outcome] || [run.outcome, ""];
  return `<span class="badge b-${esc(run.outcome)}" title="${esc(o[1])}">${esc(o[0])}</span>`;
}
function delta(metric, d, digits, status) {
  if (d === null || d === undefined) return `<span class="muted">–</span>`;
  const better = HIGHER.has(metric) ? d > 0 : d < 0, same = Math.abs(d) < 1e-9;
  const cls = status ? ({ improved: "good", worse: "bad" }[status] || "muted") : (same ? "muted" : (better ? "good" : "bad"));
  return `<span class="${cls}">${d > 0 ? "+" : ""}${Number(d).toFixed(digits)}</span>`;
}
function verdictWord(status) {
  return { improved: `<span class="good">better</span>`, worse: `<span class="bad">worse</span>`, same: `<span class="muted">same</span>` }[status] || "–";
}

// ---- data ------------------------------------------------------------------------------------------------------
let lastSig = "";
async function load(force) {
  try {
    const res = await fetch(`/api/runs?include=${state.include}`);
    const data = await res.json();
    state.runs = data.runs; state.compare = data.compare;
    const lock = document.getElementById("lock");
    lock.textContent = data.lock ? `● Running now: ${data.lock.what}` : "";
    lock.className = "lock" + (data.lock ? " on" : "");
    if (state.view === "analyzer" && (force || !state.analyzer || state.analyzer.selected !== state.base)) {
      const a = await fetch(`/api/analyzer${state.base ? "?b=" + encodeURIComponent(state.base) : ""}`);
      state.analyzer = a.ok ? await a.json() : null;
      if (state.analyzer) state.base = state.analyzer.selected;
    }
    if (state.key && state.view === "runs") {
      const r = await fetch(`/api/run?key=${encodeURIComponent(state.key)}`);
      state.detail = r.ok ? await r.json() : null;
      const running = state.detail && state.detail.status === "running";
      if (state.detail && (force || state.testsKey !== state.key + "|" + state.tm || running)) {
        const t = await fetch(`/api/tests?key=${encodeURIComponent(state.key)}${state.tm ? "&m=" + encodeURIComponent(state.tm) : ""}`);
        state.tests = t.ok ? await t.json() : null;
        if (state.tests) { state.tm = state.tests.selected; state.testsKey = state.key + "|" + state.tm; }
      }
    }
    document.getElementById("updated").textContent = "Updated " + new Date().toLocaleTimeString();
    const sig = JSON.stringify([state.view, state.approach, state.analyzer && state.analyzer.selected, state.key, state.runs, state.detail, state.tests && state.tests.selected, state.tests && state.tests.counts]);
    if (force || sig !== lastSig) { lastSig = sig; render(); }
  } catch (e) {
    document.getElementById("updated").textContent = "Dashboard server not reachable";
  }
}

// ---- layout ----------------------------------------------------------------------------------------------------
const NAV = [["guide", "📘 Guide", "What everything means (opens beside the page)"], ["metrics", "📏 Metrics", "The five quality metrics, one by one"],
             ["analyzer", "🔍 Code Quality Analyzer", "What the analyzer measured in the starting code"],
             ["runs", "🧪 Experiment Runs", "Every refactoring run of the three approaches"], ["compare", "📊 Refactoring Comparison", "The three approaches side by side"]];
function renderNav() {
  document.getElementById("nav-main").innerHTML = NAV.map(([id, label, tip]) => id === "guide"
    ? `<button class="nav ${state.guide ? "active" : ""}" data-drawer="1" id="guide-btn" title="${esc(tip)}">${label}</button>`
    : `<button class="nav ${state.view === id ? "active" : ""}" data-view="${id}" title="${esc(tip)}">${label}${id === "runs" ? ` <span class="n">${state.runs.length}</span>` : ""}</button>`).join("");
}

function render() {
  renderNav();
  const main = document.getElementById("main");
  if (state.view === "compare") { main.innerHTML = renderCompare(); return; }
  if (state.view === "metrics") { main.innerHTML = renderMetricsPage(); return; }
  if (state.view === "analyzer") { main.innerHTML = renderAnalyzer(); return; }
  const a = APPROACH[state.approach];
  const tabs = `<div class="atabs">${VIEWS.map(id => `<button data-approach="${id}" class="${state.approach === id ? "on" : ""}">
      <b>${APPROACH[id].name}</b> <span class="n">${state.runs.filter(r => r.approach === id).length}</span><small>${APPROACH[id].short}</small></button>`).join("")}</div>`;
  const head = `<div class="pagehead"><h1>Experiment Runs</h1><p>Every refactoring run, by approach. Pick a run on the left to see what happened.</p></div>${tabs}
    <p class="lead" style="margin-top:-4px">${esc(a.what)} ${q("approaches", "How the three approaches differ")}</p>`;
  const runs = state.runs.filter(r => r.approach === state.approach);
  if (!runs.length) {
    main.innerHTML = head + `<p class="empty">No ${esc(a.name)} runs yet. They appear here as soon as the engine starts one.</p>`;
    return;
  }
  if (!runs.some(r => r.key === state.key)) { state.key = runs[0].key; state.detail = null; state.tests = null; state.tm = null; save(); load(true); }
  main.innerHTML = head + `<div class="cols"><div class="list">${runs.map(renderItem).join("")}</div><div>${renderDetail()}</div></div>`;
  renderTestsBody();
}

function renderItem(run) {
  const kind = kindOf(run), code = codeOf(run);
  const cc = run.deltas && run.deltas.mean_cc, ccStatus = (run.metric_status || {}).mean_cc;
  return `<div class="item ${run.key === state.key ? "sel" : ""}" data-key="${esc(run.key)}">
    <div class="top"><span class="name">${esc(runName(run))}</span>${badge(run)}</div>
    <div class="sub"><span title="${esc(code.tip)}">${esc(code.label)}</span> · ${esc(date(run.started_at))} · <span class="id" title="${esc(FIELD.id)}">${esc(run.run_id)}</span></div>
    <div class="sub">${mins(run.claude_s)} of Claude work${run.usd ? " · $" + fmt(run.usd) : ""}${cc !== null && cc !== undefined ? " · complexity " + delta("mean_cc", cc, 2, ccStatus) : ""}</div>
    ${run.status === "running" ? `<div class="sub">${esc(run.current)}</div>` : ""}
  </div>`;
}

// ---- one run ---------------------------------------------------------------------------------------------------
function story(d) {
  const out = d.outcome, rep = repeatOf(d);
  const repeated = state.runs.find(r => r.approach === d.approach && r.run_id !== d.run_id && repeatOf(r) && repeatOf(r).run_id === d.run_id);
  const tail = repeated ? ` It was repeated as ${esc(runName(repeated))} (${esc(repeated.run_id)}).` : "";
  const head = rep ? `This run repeats ${esc(rep.run_id)}, which did not count. ` : "";
  if (d.status === "running") return [`${head}The run is in progress: ${esc(d.current)}`, ""];
  if (d.status === "limit_cut" || out === "discarded_limit") return [`${head}The Claude account reached its usage limit before Claude finished, so the run does not count.${tail}`, "warn"];
  if (out === "invalid") return [`${head}This run does not count because of a technical problem, not because of Claude's code: ${esc((d.reasons || [])[0] || "")}.${tail}`, "bad"];
  const lastFacts = (d.final || {}).best || (d.final || {}).last || (d.final || {}).round1;
  const statusOf = Object.values(d.metric_status || {}).some(Boolean) ? d.metric_status
    : Object.fromEntries(Object.entries((lastFacts || {}).metrics || {}).map(([m, v]) => [m, v && v.status]));
  const changed = Object.entries(statusOf || {}).filter(([, s]) => s === "improved").map(([m]) => (METRICS.find(x => x[0] === m) || [, m])[1].toLowerCase());
  const worse = Object.entries(statusOf || {}).filter(([, s]) => s === "worse").map(([m]) => (METRICS.find(x => x[0] === m) || [, m])[1].toLowerCase());
  const tests = d.regressions ? `${d.regressions} test(s) that passed at the start now fail` : "every test that passed at the start still passes";
  if (out === "success") return [`${head}Claude refactored the code and ${tests}. Improved: ${changed.join(", ") || "–"}${worse.length ? "; worse: " + worse.join(", ") : ""}. The result counts as a successful refactoring.`, "good"];
  if (out === "no_improvement") return [`${head}Nothing broke (${tests}), but the code did not improve by our rule${worse.length ? ": " + worse.join(", ") + " got worse" : ""}. The starting code stays the best result.`, "warn"];
  if (out === "no_change") return [`${head}Claude did not change the application code.`, ""];
  if (out === "failed") return [`${head}The refactoring broke something: ${esc((d.reasons || []).join("; ") || tests)}.`, "bad"];
  return [head, ""];
}

function renderDetail() {
  const d = state.detail;
  if (!d || d.key !== state.key) return `<div class="panel"><p class="muted">Loading…</p></div>`;
  const w = d.window || {}, kind = kindOf(d), code = codeOf(d), [text, tone] = story(d);
  const field = (label, tip, value, note = "") => `<div><span><span class="${tip ? "hint" : ""}" title="${esc(tip || "")}">${label}</span></span><b>${value}</b>${note ? `<em>${note}</em>` : ""}</div>`;
  const roles = d.roles ? [
    field("Subagent calls", FIELD.subagents, Object.entries(d.roles.subagent_calls || {}).map(([r, n]) => `${esc(r)} ${n}`).join(" · ") || "none"),
    field("Test command runs", FIELD.testruns, `${d.roles.test_runs}${d.budget ? " of " + d.budget.test_runs : ""}`),
    field("Blocked attempts", FIELD.blocked, (d.roles.blocked || []).length),
    field("Read-only shell commands", FIELD.shell, (d.roles.read_only_shell || []).length)].join("") : "";
  let html = `<div class="panel">
    <div class="title"><span class="name">${esc(APPROACH[d.approach].name)} · ${esc(runName(d))}</span>${badge(d)}
      <span class="chip" title="${esc(kind.tip)}">${esc(kind.label)}</span><span class="id" title="${esc(FIELD.id)}">${esc(d.run_id)}</span></div>
    <div class="subtitle">${esc(code.label)}${d.tests_modules ? `, tests of modules ${esc(d.tests_modules)}` : ""} · ${esc(kind.tip)}</div>
    ${text ? `<div class="story ${tone}">${text} ${q("outcomes", "What the outcomes mean")}</div>` : ""}
    <div class="meta">
      ${field("Started", FIELD.started, esc(date(d.started_at)))}
      ${field("Start code", FIELD.code, esc(code.label), esc(/^[0-9a-f]{40}$/.test(d.start_ref || "") ? d.start_sha : d.start_ref))}
      ${field(d.approach === "single" ? "Claude calls" : "Calls / rounds", FIELD.calls, d.approach === "single" ? d.calls : `${d.calls} / ${d.rounds} (${d.accepted} kept)`)}
      ${field("Claude time", FIELD.time, mins(d.claude_s))}
      ${field("Cost (list price)", FIELD.cost, d.usd ? "$" + fmt(d.usd) : "–", "size measure, not a bill")}
      ${field("5-hour usage window", FIELD.window, `${fmt(w.start, 0)}% → ${w.end === null || w.end === undefined ? "–" : fmt(w.end, 0) + "%"}`, w.used !== null && w.used !== undefined ? `this run used ${fmt(w.used, 0)} points` : "")}
      ${field("Account", FIELD.account, esc(d.account))}
      ${field("Model", FIELD.model, `${esc(d.model)} · ${esc(d.effort)}`)}
      ${roles}
    </div>
    ${d.stop_reason && d.status === "finished" ? `<p class="note">Stopped because: ${esc(d.stop_reason)}</p>` : ""}
  </div>`;
  const nTests = state.tests && state.tests.cases ? state.tests.cases.filter(c => !["passed", "fixed", "skipped"].includes(c.status)).length : 0;
  const tabs = [["overview", "Overview"], ["tests", `Tests${nTests ? ` <span class="tn bad">${nTests}</span>` : ""}`],
                ["rounds", d.approach === "single" ? "Calls & timeline" : "Rounds, calls & timeline"]];
  html += `<div class="rtabs">${tabs.map(([id, l]) => `<button data-rtab="${id}" class="${state.rtab === id ? "on" : ""}">${l}</button>`).join("")}</div>`;
  html += renderLive(d);
  if (state.rtab === "overview") html += renderProblems(d) + renderChanges(d) + renderMetrics(d);
  else if (state.rtab === "tests") html += renderTests(d);
  else html += renderRounds(d) + renderCalls(d) + renderTimeline(d);
  return html;
}

function renderLive(d) {
  if (!d.live) return "";
  const l = d.live;
  const actions = (l.actions || []).slice().reverse().map(a =>
    `<div><span class="tool">${esc(a.tool)}</span>${esc(a.target)}</div>`).join("") || `<div class="muted">No tool call yet.</div>`;
  return `<div class="panel live"><h2><span class="dot"></span>Live${l.call ? ` · call ${l.call}` : ""}</h2>
    <p class="lead">What Claude is doing right now.</p>
    <div><b>Now:</b> ${esc(d.current)}</div>
    ${l.call ? `<h3>Latest actions of Claude</h3><div class="actions">${actions}</div>
    ${l.text ? `<h3>Latest message</h3><pre>${esc(l.text)}</pre>` : ""}` : ""}
  </div>`;
}

const caseLink = x => `<a class="case" data-case="${esc(x.case)}" title="Show this test">${esc(x.case)}</a>${x.module ? " (module " + esc(x.module) + ")" : ""}`;
function renderProblems(d) {
  const items = [];
  if (d.status === "finished" && d.valid === false) items.push(...d.reasons.map(r => `Run does not count: ${esc(r)}`));
  const reverts = d.approach !== "single";
  const dropped = d.approach === "multiagent" ? " → round not kept" : " → round undone";
  if (d.outcome === "failed" && !reverts) items.push(...d.reasons.map(r => `Run failed: ${esc(r)}`));
  (d.calls_detail || []).forEach(c => (c.invalid || []).forEach(r => items.push(`Call ${c.number}: ${esc(r)}`)));
  const notes = (d.roles && d.roles.blocked || []).map(b => esc(b));
  (d.rounds_detail || []).forEach(r => {
    if (r.regressions.length) items.push(`${reverts ? "Round " + r.round + ": " : ""}${r.regressions.length} test(s) broke – ` +
      r.regressions.map(caseLink).join(", ") + (reverts && r.accepted === false ? dropped : ""));
    if (r.api_changed) items.push(`Round ${r.round}: the REST API changed (${esc(r.api_change_kind || "unclassified")})${reverts && r.accepted === false ? dropped : ""}`);
    (r.problems || []).forEach(p => items.push(`Round ${r.round}: ${esc(p)}`));
  });
  const seen = new Set();
  Object.values(d.final || {}).forEach(f => {
    if (seen.has(f.round)) return; seen.add(f.round);
    if (reverts && (f.regressions || []).length) items.push(`Final check of round ${f.round} (feedback and held-out tests): ` + f.regressions.map(caseLink).join(", "));
  });
  if (d.outcome === "failed" && reverts) items.push(...d.reasons.map(r => `Run failed: ${esc(r)}`));
  const blockedBox = notes.length ? `<div class="panel"><h2>Blocked attempts ${q("validity", "What counts as blocked")}</h2>
    <p class="lead">Claude tried to use something the rules do not allow; the attempt was refused and counted. The run stays valid.</p>
    <ul>${notes.map(n => `<li>${n}</li>`).join("")}</ul></div>` : "";
  if (!items.length) return blockedBox;
  return `<div class="problem"><h2>Where it went wrong</h2><p class="lead">Click a test ID to see the test and its error below.</p><ul>${[...new Set(items)].map(i => `<li>${i}</li>`).join("")}</ul></div>` + blockedBox;
}

function renderChanges(d) {
  const ch = d.changes;
  if (!ch) return "";
  const size = ch.size || {}, sloc = ch.sloc || {};
  const lastFacts = (d.final || {}).best || (d.final || {}).last || (d.final || {}).round1 || {};
  const lines = METRICS.map(([m, label, digits]) => {
    const v = (lastFacts.metrics || {})[m] || {};
    if (typeof v.after !== "number" || typeof (d.start_metrics || {})[m] !== "number") return "";
    const before = d.start_metrics[m], g = METRIC_GUIDE[m];
    const pct = before ? Math.round(100 * (v.after - before) / Math.abs(before)) : 0;
    const tone = v.status === "improved" ? "good" : v.status === "worse" ? "bad" : "";
    const word = v.status === "improved" ? "better" : v.status === "worse" ? "worse" : "about the same";
    return `<div class="mline ${tone}"><span class="arrow">${tone === "good" ? "✓" : tone === "bad" ? "✗" : "="}</span>
      <span><b>${label}</b> got <b>${word}</b>: ${fmt(before, digits)} → ${fmt(v.after, digits)}<span class="desc" style="display:inline"> · ${esc(g.question)}</span></span>
      <small>${pct > 0 ? "+" : ""}${pct} %</small></div>`;
  }).join("");
  const smellRows = Object.entries(ch.smells || {}).filter(([, v]) => v.before || v.after)
    .sort((a, b) => Math.abs(b[1].after - b[1].before) - Math.abs(a[1].after - a[1].before))
    .map(([id, v]) => `<tr><td>${esc(SMELLS[id] || id)} <span class="id">${esc(id)}</span></td><td class="num">${v.before}</td><td class="num">${v.after}</td>
      <td class="num">${v.after === v.before ? `<span class="muted">0</span>` : `<span class="${v.after < v.before ? "good" : "bad"}">${v.after > v.before ? "+" : ""}${v.after - v.before}</span>`}</td></tr>`).join("");
  const names = (list, n) => list.slice(0, 12).map(x => `<span class="id">${esc(x.replace(/^(function|class) /, ""))}</span>`).join(", ") + (n > 12 ? ` and ${n - 12} more` : "");
  return `<div class="panel"><h2>What the refactoring changed ${q("metrics", "What the metrics mean")}</h2>
    <p class="lead">${ch.kept ? "The kept result compared with the starting code." : "The last version Claude produced (it was not kept, so the starting code remains the result)."}</p>
    <div class="facts">
      <div class="fact"><b>${size.files_changed ?? "–"}</b><span>files changed${size.files_added ? ` · ${size.files_added} new` : ""}${size.files_removed ? ` · ${size.files_removed} removed` : ""}</span></div>
      <div class="fact"><b><span class="good">+${size.lines_added ?? 0}</span> <span class="bad">−${size.lines_removed ?? 0}</span></b><span>lines added / removed</span></div>
      <div class="fact"><b>${sloc.before ?? "–"} → ${sloc.after ?? "–"}</b><span>lines of code${typeof sloc.drop_pct === "number" ? ` (${sloc.drop_pct > 0 ? "−" : "+"}${fmt(Math.abs(sloc.drop_pct), 1)} %)` : ""}</span></div>
      <div class="fact"><b>${ch.added} / ${ch.removed}</b><span>functions or classes created / removed</span></div>
    </div>
    <div class="mlines">${lines}</div>
    ${smellRows ? `<details><summary>Code smells by type</summary><table><tr><th>Bad pattern</th><th class="num">Before</th><th class="num">After</th><th class="num">Change</th></tr>${smellRows}</table></details>` : ""}
    ${ch.added || ch.removed ? `<details><summary>New and removed functions and classes</summary>
      ${ch.added ? `<p><b class="good">Created (${ch.added}):</b> ${names(ch.added_names, ch.added)}</p>` : ""}
      ${ch.removed ? `<p><b class="bad">Removed or merged (${ch.removed}):</b> ${names(ch.removed_names, ch.removed)}</p>` : ""}</details>` : ""}
  </div>`;
}

function renderMetrics(d) {
  const f = d.final || {};
  const after = vals => Object.fromEntries(Object.entries(vals || {}).map(([m, v]) => [m, v && typeof v === "object" ? v.after : v]));
  const cols = [["Start", d.start_metrics]];
  let ref = null;
  if (f.best) {
    if (f.round1 && f.round1.round !== f.best.round) cols.push(["Round 1", after(f.round1.metrics), f.round1.metrics]);
    cols.push([d.approach === "single" ? "After" : `Best${d.best_round ? " (round " + d.best_round + ")" : ""}`, after(f.best.metrics), f.best.metrics]);
    if (f.last && f.last.round !== f.best.round) cols.push([`Last (round ${f.last.round})`, after(f.last.metrics), f.last.metrics]);
    ref = f.best.metrics;
  } else if (f.last || f.round1) {
    const x = f.last || f.round1;
    cols.push([`Round ${x.round} (not kept)`, after(x.metrics), x.metrics]);
    ref = x.metrics;
  } else if ((d.rounds_detail || []).length) {
    const last = d.rounds_detail[d.rounds_detail.length - 1];
    cols.push([`Round ${last.round}${d.status === "running" ? " (so far)" : ""}`, after(last.metrics), last.metrics]);
    ref = last.metrics;
  }
  if (cols.length === 1 && d.status === "finished") return "";
  const rows = METRICS.map(([m, label, digits, desc, tool, short]) => {
    const v = ref && ref[m];
    return `<tr><td title="${esc(desc + " Tool: " + tool + ".")}">${label}<span class="desc">${esc(short)}</span></td>${cols.map(([, vals]) => `<td class="num">${fmt(vals && vals[m], digits)}</td>`).join("")}
      <td class="num">${v ? delta(m, v.delta, digits, v.status) : "–"}</td>
      <td class="num" title="A change smaller than ${THRESHOLD[m]} counts as the same.">${v ? verdictWord(v.status) : "–"}</td></tr>`;
  }).join("");
  const best = f.best;
  const succ = best ? (best.run_successful ? `<span class="good">meets the success rule</span>` :
    `<span class="bad">does not meet the success rule</span>${(best.reasons || []).length ? ": " + esc(best.reasons.join("; ")) : ""}`) : "";
  const statusCols = cols.map(([l, , st]) => st);
  const shortOf = l => l.replace(/^Best.*/, "Best").replace(/^Last.*/, "Last").replace(/ \(.*\)$/, "").replace("Round ", "R");
  const charts = METRICS.map(([m, label, digits]) => metricChart(m, label, digits,
    cols.map(([l, vals], i) => ({ label: l, short: shortOf(l), v: vals && typeof vals[m] === "number" ? vals[m] : null,
                                  status: i > 0 && statusCols[i] ? (statusCols[i][m] || {}).status : null })))).join("");
  const mode = state.mv || "both";
  const toggle = `<span class="viewtoggle">${["both", "table", "chart"].map(v => `<button data-mv="${v}" class="${mode === v ? "on" : ""}">${{ both: "Table + chart", table: "Table", chart: "Chart" }[v]}</button>`).join("")}</span>`;
  return `<div class="panel"><h2>Code quality ${q("metrics", "What each metric measures")}${toggle}</h2>
    <p class="lead">The five metrics that decide success, before and after refactoring. Green is better, red is worse.</p>
    ${mode !== "chart" ? `<table><tr><th>Metric</th>${cols.map(([l]) => `<th class="num">${l}</th>`).join("")}<th class="num">Change</th><th class="num">Decision</th></tr>${rows}</table>` : ""}
    ${mode !== "table" ? `<div class="charts">${charts}</div>` : ""}
    ${succ ? `<p class="note">${d.approach === "single" ? "The result" : "The best result"} ${succ}. ${q("success", "The success rule")}</p>` : ""}
    <p class="note">Successful = no test that passed at the start fails now, no metric is worse, at least one is better, and the API is unchanged.</p></div>`;
}

// ---- charts (inline SVG, no library) -----------------------------------------------------------------------------
// One small chart per metric, each with its own scale: the five metrics have very different units.
function metricChart(metric, label, digits, bars) {
  const vals = bars.map(b => b.v).filter(v => typeof v === "number");
  if (!vals.length) return "";
  const W = 220, H = 120, top = 16, bottom = 22, left = 4, right = 4;
  const lo = Math.min(...vals), hi = Math.max(...vals);
  // zoom in around the values so small changes are visible, but say so: the axis does not start at zero
  const pad = (hi - lo) * 0.6 || Math.abs(hi) * 0.05 || 1;
  const min = Math.max(0, lo - pad), max = hi + pad * 0.4;
  const bw = Math.min(40, (W - left - right) / bars.length - 10);
  const step = (W - left - right) / bars.length;
  const y = v => top + (H - top - bottom) * (1 - (v - min) / (max - min || 1));
  const base = bars[0] && typeof bars[0].v === "number" ? bars[0].v : null;
  const higher = HIGHER.has(metric);
  const rects = bars.map((b, i) => {
    if (typeof b.v !== "number") return "";
    const x = left + i * step + (step - bw) / 2, yy = y(b.v);
    let color = "var(--muted)";
    if (i > 0 && base !== null) {
      const st = b.status;
      color = st === "improved" ? "var(--good)" : st === "worse" ? "var(--bad)" : (b.v === base ? "var(--muted)" : ((higher ? b.v > base : b.v < base) ? "var(--good)" : "var(--bad)"));
      if (st === "same") color = "var(--muted)";
    } else if (i === 0) color = "var(--accent)";
    return `<rect x="${x}" y="${yy}" width="${bw}" height="${H - bottom - yy}" rx="2" fill="${color}" opacity="${i === 0 ? 0.55 : 0.85}"><title>${esc(b.label)}: ${Number(b.v).toFixed(digits)}</title></rect>
      <text class="v" x="${x + bw / 2}" y="${yy - 4}" text-anchor="middle">${Number(b.v).toFixed(digits)}</text>
      <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(b.short || b.label)}</text>`;
  }).join("");
  return `<div class="chart"><div class="ct">${esc(label)}</div><div class="cs">${higher ? "higher is better" : "lower is better"} · axis zoomed</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><line x1="0" x2="${W}" y1="${H - bottom}" y2="${H - bottom}" stroke="var(--line)"/>${rects}</svg></div>`;
}

// Mean change per approach for one metric: bars from a zero line, green = better, red = worse.
function changeChart(metric, label, digits, values) {
  const W = 220, H = 140, mid = 66, span = 44;
  const nums = values.map(v => v.v).filter(v => typeof v === "number");
  const m = Math.max(...nums.map(Math.abs), 1e-9);
  const higher = HIGHER.has(metric), step = W / values.length, bw = Math.min(44, step - 16);
  const bars = values.map((b, i) => {
    const x = i * step + (step - bw) / 2;
    if (typeof b.v !== "number") return `<text x="${x + bw / 2}" y="${mid - 4}" text-anchor="middle">no data</text><text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${esc(b.short)}</text>`;
    const h = Math.abs(b.v) / m * span, good = higher ? b.v > 0 : b.v < 0;
    const yy = b.v >= 0 ? mid - h : mid;
    return `<rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(h, 1)}" rx="2" fill="${b.v === 0 ? "var(--muted)" : good ? "var(--good)" : "var(--bad)"}" opacity=".85"><title>${esc(b.label)}: ${b.v > 0 ? "+" : ""}${Number(b.v).toFixed(digits)}</title></rect>
      <text class="v" x="${x + bw / 2}" y="${b.v >= 0 ? yy - 4 : yy + h + 11}" text-anchor="middle">${b.v > 0 ? "+" : ""}${Number(b.v).toFixed(digits)}</text>
      <text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${esc(b.short)}</text>`;
  }).join("");
  return `<div class="chart"><div class="ct">${esc(label)}</div><div class="cs">mean change · ${higher ? "higher" : "lower"} is better</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>${bars}</svg></div>`;
}

// Success rate per approach, 0–100 %.
function rateChart(rates) {
  const W = 220, H = 120, top = 16, bottom = 22, step = W / rates.length, bw = Math.min(44, step - 16);
  const y = v => top + (H - top - bottom) * (1 - v / 100);
  const bars = rates.map((r, i) => {
    const x = i * step + (step - bw) / 2;
    const label = `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(r.short)}</text>`;
    if (r.v === null) return `<text x="${x + bw / 2}" y="${H - bottom - 6}" text-anchor="middle">no data</text>` + label;
    return `<rect x="${x}" y="${y(r.v)}" width="${bw}" height="${Math.max(H - bottom - y(r.v), 1)}" rx="2" fill="var(--accent)" opacity=".8"><title>${esc(r.label)}: ${r.v} %</title></rect>
      <text class="v" x="${x + bw / 2}" y="${y(r.v) - 4}" text-anchor="middle">${r.v} %</text>` + label;
  }).join("");
  return `<div class="chart"><div class="ct">Success rate</div><div class="cs">share of valid runs that were successful</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Success rate"><line x1="0" x2="${W}" y1="${H - bottom}" y2="${H - bottom}" stroke="var(--line)"/>${bars}</svg></div>`;
}

// ---- tests -----------------------------------------------------------------------------------------------------
function renderTests(d) {
  const t = state.tests;
  if (!t || !t.measurements || !t.measurements.length) {

  }
  const sets = Object.entries(t.counts || {}).sort().map(([s, c]) => {
    const bad = c.regression + c.missing, warn = c.failed_unconfirmed + c.still_failing, ok = c.passed + c.fixed;
    const pct = n => c.total ? (100 * n / c.total) : 0;
    return `<div class="setbox" title="${esc(SETTIP[s] || "")}"><div class="muted">${esc(SETNAME[s] || s)}</div>
      <b>${ok} / ${c.total}</b> pass now

      <div class="note">${c.regression ? `<span class="bad">${c.regression} broke</span> · ` : ""}${c.still_failing ? `${c.still_failing} failed already at the start · ` : ""}${c.fixed ? `${c.fixed} fixed · ` : ""}${c.failed_unconfirmed ? `${c.failed_unconfirmed} failed once (unstable) · ` : ""}${c.missing ? `<span class="bad">${c.missing} missing</span> · ` : ""}${esc(SETTIP[s] || "")}</div></div>`;

  const btn = (id, label) => `<button data-tf="${id}" class="${state.tf === id ? "on" : ""}">${label}</button>`;
  return `<div class="panel" id="tests-panel"><h2>Tests ${q("tests", "Feedback and held-out tests")}</h2>
    <p class="lead">Every test, at the start and now. Click a row to see the test code, what it checks and why it failed.</p>

      <input id="tq" type="search" placeholder="Search test ID, module, requirement or text…" value="${esc(state.tq)}">

    ${!t.start_known ? `<p class="note">The starting results were not found, so "Broke" and "Failed at start" cannot be told apart here.</p>` : ""}

}

function renderTestsBody() {
  const body = document.getElementById("tests-body");
  const t = state.tests;
  if (!body || !t) return;
  const query = state.tq.trim().toLowerCase();
  let cases = t.cases.filter(c => state.ts === "all" || c.set === state.ts);
  if (state.tf === "problems") cases = cases.filter(c => !["passed", "fixed", "skipped"].includes(c.status));
  else if (state.tf === "passed") cases = cases.filter(c => c.status === "passed");
  else if (state.tf === "changed") cases = cases.filter(c => c.start && c.after && c.start !== c.after);
  if (query) cases = cases.filter(c => [c.case, c.module, c.area, c.requirement, c.input, c.expected, c.message, c.type].join(" ").toLowerCase().includes(query));
  if (!cases.length) {
    body.innerHTML = `<p class="muted">${state.tf === "problems" && !query ? "No problems: every test that passed at the start still passes." : "No test matches."}</p>`;
    return;
  }
  const limit = state.tall ? cases.length : 150;
  const rows = cases.slice(0, limit).map(c => {
    const [label, tip] = TEST_STATUS[c.status] || [c.status, ""];
    const open = state.open.has(c.case);
    const detail = open ? `<tr><td colspan="6"><div class="casebox"><dl>
        <dt>Area</dt><dd>${esc(c.area || "module " + c.module)}</dd>
        ${c.requirement ? `<dt>Requirement</dt><dd>${esc(c.requirement)}</dd>` : ""}
        <dt>Test type</dt><dd>${esc(c.type || "–")} · ${esc(SETNAME[c.set] || c.set)}</dd>
        ${c.input ? `<dt>Input</dt><dd>${md(c.input)}</dd>` : ""}
        ${c.expected ? `<dt>Expected</dt><dd>${md(c.expected)}</dd>` : ""}
        <dt>Result</dt><dd>${esc(c.start || "–")} at the start → ${esc(c.after || "–")} now. ${esc(tip)}${c.flaky ? " This test is on the list of unstable tests and is left out of the comparison." : ""}</dd>
      </dl>${c.message ? `<h3 class="bad">Why it failed</h3>${errorBlock(c.message)}` : (["passed", "fixed", "skipped"].includes(c.status) ? "" : `<p class="note">Error text not available here (see the note below the table).</p>`)}
      ${codeBlock(c)}</div></td></tr>` : "";
    return `<tr class="case-row" data-open="${esc(c.case)}" id="case-${esc(c.case)}"><td><span class="pill s-${esc(c.status)}" title="${esc(tip)}">${esc(label)}</span></td>
      <td><span class="id">${esc(c.case)}</span></td><td>${esc(c.area || "module " + c.module)}</td><td title="${esc(SETTIP[c.set] || "")}">${esc(c.set === "heldout" ? "held-out" : c.set)}</td>
      <td>${esc(c.type)}</td><td class="muted">${esc(c.start || "–")} → ${esc(c.after || "–")}</td></tr>${detail}`;
  }).join("");
  body.innerHTML = `<table><tr><th>Status</th><th>Test</th><th>Area</th><th>Set</th><th>Type</th><th>Start → now</th></tr>${rows}</table>
    ${cases.length > limit ? `<p class="note">${limit} of ${cases.length} shown. <a href="#" data-tall="1">Show all</a></p>` : ""}`;
}

function errorBlock(text) {
  const lines = String(text).split("\n").map(l => /^E\s/.test(l) || /Error\b|assert/i.test(l) && /^E|^\s*>/.test(l)
    ? `<span class="${/^\s*>/.test(l) ? "gt" : "e"}">${esc(l)}</span>` : (/^\s*>/.test(l) ? `<span class="gt">${esc(l)}</span>` : esc(l)));
  return `<pre class="err">${lines.join("\n")}</pre>`;
}
function failingLines(message) {
  const out = new Set();
  for (const m of String(message || "").matchAll(/test_[a-z0-9_]+\.py:(\d+)/g)) out.add(Number(m[1]));
  return out;
}
// A small Python highlighter (keywords, strings, numbers, comments, names), enough for the test code.
const PY_KW = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
const PY_BI = new Set("len range print str int float dict list set tuple isinstance sum min max any all sorted enumerate zip open self client".split(" "));
const PY_TOKEN = /("""[\s\S]*?"""|'\'\'[\s\S]*?'\'\'|[rbfu]{0,2}"(?:\\.|[^"\\\n])*"|[rbfu]{0,2}'(?:\\.|[^'\\\n])*')|(#[^\n]*)|(\b\d+(?:\.\d+)?\b)|(@[A-Za-z_][\w.]*)|([A-Za-z_]\w*)/g;
function highlight(code) {
  // returns one HTML string per line; a token that spans lines (docstring) is split at the line ends
  const parts = []; let last = 0, prevWord = "";
  for (const m of code.matchAll(PY_TOKEN)) {
    if (m.index > last) parts.push(["", code.slice(last, m.index)]);
    let cls = "";
    if (m[1]) cls = "hl-s"; else if (m[2]) cls = "hl-c"; else if (m[3]) cls = "hl-n"; else if (m[4]) cls = "hl-d";
    else if (m[5]) cls = PY_KW.has(m[5]) ? "hl-k" : (prevWord === "def" || prevWord === "class") ? "hl-f" : PY_BI.has(m[5]) ? "hl-b" : "";
    if (m[5]) prevWord = m[5];
    parts.push([cls, m[0]]);
    last = m.index + m[0].length;
  }
  if (last < code.length) parts.push(["", code.slice(last)]);
  const lines = [""];
  for (const [cls, text] of parts) {
    text.split("\n").forEach((piece, i) => {
      if (i > 0) lines.push("");
      if (piece) lines[lines.length - 1] += cls ? `<span class="${cls}">${esc(piece)}</span>` : esc(piece);
    });
  }
  return lines;
}
const CODE_CACHE = {};
function codeBlock(c) {
  const key = c.set + "|" + c.case, code = CODE_CACHE[key];
  if (code === undefined) {
    CODE_CACHE[key] = null;
    fetch(`/api/testcode?case=${encodeURIComponent(c.case)}&set=${encodeURIComponent(c.set)}`)
      .then(r => r.ok ? r.json() : false).then(j => { CODE_CACHE[key] = j || false; renderTestsBody(); })
      .catch(() => { CODE_CACHE[key] = false; renderTestsBody(); });
    return `<h3>Test code</h3><p class="note">Loading…</p>`;
  }
  if (code === null) return `<h3>Test code</h3><p class="note">Loading…</p>`;
  if (!code) return `<h3>Test code</h3><p class="note">The code of this test was not found in dataset/lms/tests.</p>`;
  const hits = failingLines(c.message);
  const body = highlight(code.code).map((l, i) => `<span class="l${hits.has(code.line + i) ? " hit" : ""}" data-n="${code.line + i}">${l || " "}</span>`).join("");
  return `<h3>Test code <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">${esc(code.file)}${hits.size ? " · the line where it failed is red" : ""}</span></h3><pre class="code">${body}</pre>`;
}

function showCase(id) {

    const changes = METRICS.map(([m, , digits]) => { const v = r.metrics[m]; return v ? delta(m, v.delta, digits, v.status) : "–"; }).join(" · ");

// ---- code quality analyzer: what was measured in the starting code ---------------------------------------------

  if (b.final) return "Full LMS code";

}
function renderGrowth(a) {

      <td class="num">${typeof f === "number" ? (digits ? fmt(f, digits) : f.toLocaleString()) : "–"}</td><td class="num">${ratio === null ? "–" : (digits ? (f - p > 0 ? "+" : "") + fmt(f - p, digits) : "×" + fmt(ratio, 1))}</td></tr>`;

  // size: one bar pair per row, each row on its own scale (the full code's bar is always the longer one)
  const sizes = [["Lines of code", P.sloc, F.sloc], ["Files", P.files, F.files], ["Modules", P.modules, F.modules], ["Functions", P.functions, F.functions],

      <div class="gb"><i style="width:${(f || 0) / m * 100}%;background:var(--accent)"></i><b>${(f ?? 0).toLocaleString()} <em>×${p ? (f / p).toFixed(1) : "–"}</em></b></div></div></div>`; }).join("")}</div>`;

    <div class="grow"><div><span>Pilot code</span><b>${P.sloc.toLocaleString()}</b><em>lines</em></div><span class="arrow big">→</span><div><span>Full code</span><b>${F.sloc.toLocaleString()}</b><em>lines · ×${x}</em></div></div>

      ${row("Lines of code", P.sloc, F.sloc)}${row("Files", P.files, F.files)}${row("Modules", P.modules, F.modules)}${row("Functions", P.functions, F.functions)}
      ${row("Classes", P.classes, F.classes)}${row("Copy-pasted blocks", P.clones, F.clones)}${row("Test cases", P.tests, F.tests, 0, "feedback and held-out")}</table>

    <td class="num">${Number(m.sloc).toLocaleString()}</td><td class="num">${fmt(m.mean_cc, 2)}</td><td class="num">${fmt(m.mi_weighted, 1)}</td>
